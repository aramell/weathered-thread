# Type-checks and runs the test suite on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # `npm ci` rejects this macOS-generated lockfile; see sync-etsy.yml.
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run test:catalog
      - run: npm run test:sync
